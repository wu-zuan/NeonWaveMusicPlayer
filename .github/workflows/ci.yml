name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Typecheck
        run: npm run typecheck

      - name: Build Windows production executable and sidecar
        run: npm run build:dir

      - name: Regression and native service tests
        run: npm test

      - name: WebView2 playback and UI regression
        run: npm run e2e:performance

      - name: Native permissions, playlist files and shutdown
        run: node scripts/e2e-native.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation
          path: artifacts/
